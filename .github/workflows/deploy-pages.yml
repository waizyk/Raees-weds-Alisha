name: Deploy wedding website

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0c40f-mr-aa-wedding

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase publishable keys are intentionally public browser configuration.
      # Database security is enforced by Row Level Security, never by hiding this key.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://fbcomkxwkqvzwyhpxdau.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_D16Eisy8DelZNiz4GRY6-g_1Bi-iNEL
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
